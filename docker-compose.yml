services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - app-storage:/app/storage
      - app-database:/app/database
    env_file:
      - .env
    environment:
      - APP_URL=http://localhost:8080
    healthcheck:
      test: ["CMD", "php", "artisan", "about", "--only=environment"]
      interval: 10s
      timeout: 5s
      retries: 5
    command: >
      sh -c "php artisan migrate --force &&
             php artisan serve --host=0.0.0.0 --port=8080"

  # Runs the Laravel scheduler continuously, so scan-rebuild's scheduled
  # trigger (see data-layer plan) fires without relying on host cron.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - app-storage:/app/storage
      - app-database:/app/database
    env_file:
      - .env
    depends_on:
      - app
    command: ["php", "artisan", "schedule:work"]

volumes:
  app-storage:
  app-database:
