services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    volumes:
      - app-storage:/app/storage
      - app-database:/app/database
    environment:
      - RUN_MIGRATIONS=true
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    command: ["php", "artisan", "serve", "--host=0.0.0.0", "--port=8080"]

  # Runs the Laravel scheduler continuously, so scan-rebuild's scheduled
  # trigger (see data-layer plan) fires without relying on host cron.
  # Waits for app's healthcheck so it never races app's .env/APP_KEY
  # bootstrap or first migration.
  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - app-storage:/app/storage
      - app-database:/app/database
    environment:
      - RUN_MIGRATIONS=false
    depends_on:
      app:
        condition: service_healthy
    command: ["php", "artisan", "schedule:work"]

volumes:
  app-storage:
  app-database:
