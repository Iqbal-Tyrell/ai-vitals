name: Checkbox listener

# Reacts to edits on the bot's own gate comments (detected via a hidden
# HTML-comment marker + native GitHub task-list checkboxes). GitHub has
# no native "checkbox toggled" event, so this diffs the edited comment's
# body against `changes.body.from` to find unchecked -> checked
# transitions per labeled line.

on:
  issue_comment:
    types: [edited]

permissions:
  contents: read

jobs:
  handle-checkbox:
    if: github.event.comment.performed_via_github_app.slug == 'ai-vitals-bot' || github.event.comment.user.login == 'ai-vitals-bot[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Detect checkbox transitions and act
        id: detect
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.issue.number;
            const commentBody = context.payload.comment.body;
            const previousBody = context.payload.changes?.body?.from ?? '';

            function isChecked(body, label) {
              const escaped = label.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
              const re = new RegExp('- \\[( |x)\\]\\s*' + escaped);
              const m = body.match(re);
              return m ? m[1] === 'x' : null;
            }

            function wasJustChecked(label) {
              return isChecked(previousBody, label) === false
                && isChecked(commentBody, label) === true;
            }

            async function commentExists(marker) {
              const comments = await github.paginate(github.rest.issues.listComments, {
                owner, repo, issue_number, per_page: 100,
              });
              return comments.some((c) => c.body.includes(marker));
            }

            // --- Triage-gate comment: single-shot, posts Plan/Build gate ---
            if (commentBody.includes('<!-- l4:triage-gate -->')) {
              if (wasJustChecked('Approve for milestone triage')) {
                if (await commentExists('<!-- l4:plan-build-gate -->')) {
                  core.info('Plan/Build gate already posted; skipping.');
                } else {
                  await github.rest.issues.createComment({
                    owner, repo, issue_number,
                    body: ['<!-- l4:plan-build-gate -->', '- [ ] Plan', '- [ ] Build'].join('\n'),
                  });
                }
              }
              core.setOutput('run_plan', 'false');
              core.setOutput('run_build', 'false');
              return;
            }

            // --- Plan/Build gate comment: self-resetting, idempotent ---
            if (!commentBody.includes('<!-- l4:plan-build-gate -->')) {
              core.setOutput('run_plan', 'false');
              core.setOutput('run_build', 'false');
              return;
            }

            const planChecked = wasJustChecked('Plan');
            const buildChecked = wasJustChecked('Build');

            if (planChecked || buildChecked) {
              let newBody = commentBody;
              if (planChecked) newBody = newBody.replace(/- \[x\]\s*Plan/, '- [ ] Plan');
              if (buildChecked) newBody = newBody.replace(/- \[x\]\s*Build/, '- [ ] Build');
              await github.rest.issues.updateComment({
                owner, repo, comment_id: context.payload.comment.id, body: newBody,
              });
            }

            let runPlan = false;
            if (planChecked) {
              const running = await commentExists('<!-- l4:plan-running -->');
              const done = await commentExists('<!-- l4:plan-output -->');
              if (running || done) {
                core.info('Plan already exists or is running; ignoring re-check.');
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: '<!-- l4:plan-running -->\n_Plan is running..._',
                });
                runPlan = true;
              }
            }

            let runBuild = false;
            if (buildChecked) {
              const timeline = await github.paginate(github.rest.issues.listEventsForTimeline, {
                owner, repo, issue_number, per_page: 100,
              });
              let blocked = false;
              for (const ev of timeline) {
                if (ev.event !== 'cross-referenced') continue;
                if (!ev.source?.issue?.pull_request) continue;
                const prNumber = ev.source.issue.number;
                const pr = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });
                if (pr.data.state === 'open' || pr.data.merged) blocked = true;
              }
              const running = await commentExists('<!-- l4:build-running -->');
              if (blocked || running) {
                core.info('Build PR already open/merged or running; ignoring re-check.');
              } else {
                await github.rest.issues.createComment({
                  owner, repo, issue_number,
                  body: '<!-- l4:build-running -->\n_Build is running..._',
                });
                runBuild = true;
              }
            }

            core.setOutput('run_plan', String(runPlan));
            core.setOutput('run_build', String(runBuild));
            core.setOutput('issue_number', String(issue_number));

      # --- Plan: read-only OpenSpec explore, posted as an issue comment ---
      - name: Checkout (Plan)
        if: steps.detect.outputs.run_plan == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Write issue context to file (avoids shell injection from issue body)
        if: steps.detect.outputs.run_plan == 'true' || steps.detect.outputs.run_build == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const fs = require('fs');
            const title = context.payload.issue.title;
            const body = context.payload.issue.body ?? '';
            fs.writeFileSync('/tmp/issue-context.md', `# ${title}\n\n${body}\n`);

      - name: Install Copilot CLI (Plan)
        if: steps.detect.outputs.run_plan == 'true'
        run: npm install -g @github/copilot

      - name: Run Plan (openspec explore)
        if: steps.detect.outputs.run_plan == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          copilot -p "Read .github/skills/openspec-explore/SKILL.md and follow its process to explore the issue described in the file /tmp/issue-context.md (read that file for the issue title and body). This step is thinking only - do not write, edit, or modify any code or files, and do not run any commands that change repository state. Output ONLY your final exploration writeup in markdown. Do not include any other commentary before or after it." \
            --allow-tool='read' \
            --no-ask-user \
            -s \
            > /tmp/plan-output.md
          echo "--- plan output (first 80 lines) ---"
          head -80 /tmp/plan-output.md

      - name: Post Plan output
        if: steps.detect.outputs.run_plan == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = Number('${{ steps.detect.outputs.issue_number }}');
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const running = comments.find((c) => c.body.includes('<!-- l4:plan-running -->'));
            if (running) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: running.id });
            }
            let content = fs.readFileSync('/tmp/plan-output.md', 'utf8').trim();
            const maxLen = 60000; // GitHub comment body limit is 65536
            if (content.length > maxLen) {
              content = content.slice(0, maxLen) + '\n\n_(truncated)_';
            }
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: '<!-- l4:plan-output -->\n' + content,
            });

      # --- Build: OpenSpec propose -> apply, opens a PR ---
      - name: Checkout (Build)
        if: steps.detect.outputs.run_build == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}

      - name: Configure bot git identity and branch
        if: steps.detect.outputs.run_build == 'true'
        id: build-setup
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          slug="ai-vitals-bot"
          bot_id=$(gh api "/users/${slug}[bot]" --jq .id)
          git config user.name "${slug}[bot]"
          git config user.email "${bot_id}+${slug}[bot]@users.noreply.github.com"
          branch="l4/build-issue-${{ steps.detect.outputs.issue_number }}"
          git checkout -B "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "start_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Copilot CLI (Build)
        if: steps.detect.outputs.run_build == 'true'
        run: npm install -g @github/copilot

      - name: Run Build (openspec propose -> apply)
        if: steps.detect.outputs.run_build == 'true'
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          copilot -p "Read .github/skills/openspec-propose/SKILL.md and .github/skills/openspec-apply-change/SKILL.md and follow their process end to end (propose then apply) to implement the issue described in the file /tmp/issue-context.md (read that file for the issue title and body). Make the actual code/config changes needed in this repository. Follow openspec/config.yaml's project context and this repo's existing conventions (Laravel 13 + Filament, Pest, Larastan level 8, Pint). When finished, write one paragraph summarizing what you changed and why to /tmp/build-summary.md - nothing else in that file." \
            --allow-all-tools \
            --no-ask-user \
            -s

      - name: Commit and push (if there are changes)
        if: steps.detect.outputs.run_build == 'true'
        id: build-commit
        run: |
          # Copilot may or may not have committed its own changes during
          # the session above (confirmed live: it sometimes does) - check
          # both uncommitted working-tree changes AND new local commits
          # ahead of the branch's starting point, so either behavior is
          # handled correctly.
          working_tree_dirty=false
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git status --porcelain)" ]; then
            working_tree_dirty=true
          fi
          new_commits=false
          if [ "$(git rev-parse HEAD)" != "${{ steps.build-setup.outputs.start_sha }}" ]; then
            new_commits=true
          fi

          if [ "$working_tree_dirty" = "false" ] && [ "$new_commits" = "false" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$working_tree_dirty" = "true" ]; then
              git add -A
              git commit -m "Build: issue #${{ steps.detect.outputs.issue_number }}"
            fi
            git push origin "${{ steps.build-setup.outputs.branch }}" --force
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Open PR and report
        if: steps.detect.outputs.run_build == 'true'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = Number('${{ steps.detect.outputs.issue_number }}');
            const hasChanges = '${{ steps.build-commit.outputs.has_changes }}' === 'true';

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number, per_page: 100,
            });
            const running = comments.find((c) => c.body.includes('<!-- l4:build-running -->'));
            if (running) {
              await github.rest.issues.deleteComment({ owner, repo, comment_id: running.id });
            }

            if (!hasChanges) {
              await github.rest.issues.createComment({
                owner, repo, issue_number,
                body: '<!-- l4:build-output -->\n_Build ran but made no changes - nothing to open a PR for._',
              });
              return;
            }

            const summary = fs.existsSync('/tmp/build-summary.md')
              ? fs.readFileSync('/tmp/build-summary.md', 'utf8').trim()
              : '(no summary provided)';

            const issue = await github.rest.issues.get({ owner, repo, issue_number });
            const bumpLabel = issue.data.labels
              .map((l) => (typeof l === 'string' ? l : l.name))
              .find((n) => n && n.startsWith('bump:')) || 'bump:patch';

            const pr = await github.rest.pulls.create({
              owner, repo,
              title: issue.data.title,
              head: '${{ steps.build-setup.outputs.branch }}',
              base: 'main',
              body: `Closes #${issue_number}\n\n${summary}`,
            });

            await github.rest.issues.addLabels({
              owner, repo, issue_number: pr.data.number,
              labels: [bumpLabel, 'needs-review'],
            });

            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: `<!-- l4:build-output -->\nOpened #${pr.data.number}.`,
            });
