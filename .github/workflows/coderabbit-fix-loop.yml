name: CodeRabbit review fix-loop

on:
  pull_request_review:
    types: [submitted]

permissions:
  contents: read

jobs:
  fix-on-changes-requested:
    if: >
      github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.review.state == 'changes_requested' &&
      contains(github.event.pull_request.labels.*.name, 'needs-review') &&
      !contains(github.event.pull_request.labels.*.name, 'needs-human-attention')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Gather open findings and round count
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = context.payload.pull_request.number;

            const query = `
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    headRefName
                    reviewThreads(first: 100) {
                      nodes {
                        isResolved
                        comments(first: 1) {
                          nodes { author { login } path line body }
                        }
                      }
                    }
                  }
                }
              }`;
            const result = await github.graphql(query, { owner, repo, pr: pull_number });
            const pr = result.repository.pullRequest;
            const threads = pr.reviewThreads.nodes;
            const openFindings = threads.filter((t) => {
              const first = t.comments.nodes[0];
              return !t.isResolved && first && first.author && first.author.login === 'coderabbitai[bot]';
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            let round = 0;
            for (const c of comments) {
              const m = c.body.match(/<!-- l4:fix-round:(\d+) -->/);
              if (m) round = Math.max(round, parseInt(m[1], 10));
            }

            core.setOutput('open_count', String(openFindings.length));
            core.setOutput('round', String(round));
            core.setOutput('head_ref', pr.headRefName);

            const fs = require('fs');
            fs.writeFileSync('/tmp/open-findings.md', openFindings.map((t, i) => {
              const c = t.comments.nodes[0];
              return `### Finding ${i + 1}\n**Location**: \`${c.path}:${c.line}\`\n\n${c.body}`;
            }).join('\n\n'));

      - name: Escalate (5-round cap reached)
        if: steps.check.outputs.open_count != '0' && fromJSON(steps.check.outputs.round) >= 5
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['needs-human-attention'] });
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: '_Fix-loop hit its 5-round cap with unresolved CodeRabbit findings still open. Escalating to a human - no further automated fix attempts will run on this PR._',
            });

      - name: Checkout PR branch
        if: steps.check.outputs.open_count != '0' && fromJSON(steps.check.outputs.round) < 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.check.outputs.head_ref }}

      - name: Configure bot git identity
        if: steps.check.outputs.open_count != '0' && fromJSON(steps.check.outputs.round) < 5
        id: git-setup
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          slug="ai-vitals-bot"
          bot_id=$(gh api "/users/${slug}[bot]" --jq .id)
          git config user.name "${slug}[bot]"
          git config user.email "${bot_id}+${slug}[bot]@users.noreply.github.com"
          echo "start_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Install Copilot CLI
        if: steps.check.outputs.open_count != '0' && fromJSON(steps.check.outputs.round) < 5
        run: npm install -g @github/copilot

      - name: Fix open findings
        if: steps.check.outputs.open_count != '0' && fromJSON(steps.check.outputs.round) < 5
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          copilot -p "CodeRabbit's code review left open findings on this PR, listed in /tmp/open-findings.md (read that file - each has a Location: file:line and description). For each finding: first verify it is a real issue by reading the actual code at that location yourself - do not blindly apply a fix without checking. If it is a genuine issue, fix it. If you determine it is a false positive, leave the code as-is. Do not reply to or resolve any review threads yourself - CodeRabbit automatically re-reviews new commits and resolves threads its own reviewers determine are addressed. Follow this repo's existing conventions (Laravel 13 + Filament, Pest, Larastan level 8, Pint). Run the project's own validation (pest, phpstan, pint) before finishing if applicable. Write a one-paragraph summary of what you did (fixed vs judged false-positive, with brief reasoning) to /tmp/fix-summary.md - nothing else in that file." \
            --allow-all-tools \
            --no-ask-user \
            -s

      - name: Commit and push fix
        if: steps.check.outputs.open_count != '0' && fromJSON(steps.check.outputs.round) < 5
        id: commit
        run: |
          # Copilot may or may not have committed its own changes during
          # the session above - check both uncommitted working-tree
          # changes AND new local commits ahead of the branch's starting
          # point (confirmed live elsewhere in this pipeline that both
          # behaviors occur).
          working_tree_dirty=false
          if ! git diff --quiet || ! git diff --cached --quiet || [ -n "$(git status --porcelain)" ]; then
            working_tree_dirty=true
          fi
          new_commits=false
          if [ "$(git rev-parse HEAD)" != "${{ steps.git-setup.outputs.start_sha }}" ]; then
            new_commits=true
          fi

          if [ "$working_tree_dirty" = "false" ] && [ "$new_commits" = "false" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            if [ "$working_tree_dirty" = "true" ]; then
              git add -A
              next_round=$(( ${{ steps.check.outputs.round }} + 1 ))
              git commit -m "Fix: address CodeRabbit review round ${next_round}"
            fi
            git push origin "${{ steps.check.outputs.head_ref }}"
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Report fix round
        if: steps.check.outputs.open_count != '0' && fromJSON(steps.check.outputs.round) < 5
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            const nextRound = Number('${{ steps.check.outputs.round }}') + 1;
            const hasChanges = '${{ steps.commit.outputs.has_changes }}' === 'true';
            const summary = fs.existsSync('/tmp/fix-summary.md')
              ? fs.readFileSync('/tmp/fix-summary.md', 'utf8').trim()
              : '(no summary provided)';
            const body = hasChanges
              ? `<!-- l4:fix-round:${nextRound} -->\n**Fix round ${nextRound}/5** - pushed a fix commit.\n\n${summary}\n\n_CodeRabbit will re-review the new commit automatically and resolve any addressed threads on its own._`
              : `<!-- l4:fix-round:${nextRound} -->\n**Fix round ${nextRound}/5** - no changes were made (all findings judged false-positive, or already addressed).\n\n${summary}`;
            await github.rest.issues.createComment({ owner, repo, issue_number, body });

  mark-ready-on-approval:
    if: >
      github.event.review.user.login == 'coderabbitai[bot]' &&
      github.event.review.state == 'approved' &&
      contains(github.event.pull_request.labels.*.name, 'needs-review')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = context.payload.pull_request.number;
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['ready-for-merge'] });
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'needs-review' });
            } catch (e) {
              core.info(`needs-review label not present or already removed: ${e.message}`);
            }
