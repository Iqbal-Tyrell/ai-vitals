name: Cut release (open PR)

# Manually triggered: prepares a release from one of the three
# permanently-open milestone buckets (next-patch/next-minor/next-major)
# and opens a PR with the CHANGELOG.md update. Does NOT push to main
# directly - the App installation token is correctly blocked by branch
# protection (confirmed live: "Protected branch update failed... 4 of 4
# required status checks are expected"), same as any other change to
# main. Tagging, the GitHub Release, and milestone rollover happen in
# "Finalize release" once a human reviews and merges this PR - see that
# workflow. Cadence/automation mechanics beyond this manual trigger are
# deferred (per plan) - a human decides when to cut.

on:
  workflow_dispatch:
    inputs:
      bucket:
        description: Which milestone bucket to cut
        required: true
        type: choice
        options:
          - next-patch
          - next-minor
          - next-major

permissions:
  contents: read

jobs:
  open-release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          fetch-depth: 0

      - name: Determine next version and gather merged PRs
        id: version
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const bucket = '${{ inputs.bucket }}';

            // Guard against duplicate cuts: if a release PR for this
            // bucket is already open (from a prior cut not yet merged,
            // or merged but not yet finalized), refuse to open another
            // one - confirmed live that re-running otherwise computes
            // the same version twice and duplicates the CHANGELOG entry.
            const openPrs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const existingReleasePr = openPrs.find((p) =>
              p.body && p.body.includes(`"bucket":"${bucket}"`) && p.body.includes('<!-- release-meta:')
            );
            if (existingReleasePr) {
              core.setFailed(
                `PR #${existingReleasePr.number} is already an open, unmerged release PR for "${bucket}". ` +
                `Merge or close it before cutting another release from this bucket.`
              );
              return;
            }

            const milestones = await github.paginate(github.rest.issues.listMilestones, {
              owner, repo, state: 'open', per_page: 100,
            });
            const milestone = milestones.find((m) => m.title === bucket);
            if (!milestone) {
              core.setFailed(`Milestone "${bucket}" not found.`);
              return;
            }

            const prs = await github.paginate(github.rest.issues.listForRepo, {
              owner, repo, milestone: milestone.number, state: 'closed', per_page: 100,
            });
            const mergedPrs = prs.filter((p) => p.pull_request && p.pull_request.merged_at);
            if (mergedPrs.length === 0) {
              core.setFailed(`Milestone "${bucket}" has no merged PRs - nothing to release.`);
              return;
            }

            const tags = await github.paginate(github.rest.repos.listTags, {
              owner, repo, per_page: 100,
            });
            const semverTags = tags
              .map((t) => t.name.match(/^v(\d+)\.(\d+)\.(\d+)$/))
              .filter(Boolean)
              .map((m) => [parseInt(m[1]), parseInt(m[2]), parseInt(m[3])])
              .sort((a, b) => b[0] - a[0] || b[1] - a[1] || b[2] - a[2]);
            let [major, minor, patch] = semverTags[0] || [0, 0, 0];

            if (bucket === 'next-major') { major += 1; minor = 0; patch = 0; }
            else if (bucket === 'next-minor') { minor += 1; patch = 0; }
            else { patch += 1; }

            const version = `v${major}.${minor}.${patch}`;
            core.setOutput('version', version);
            core.setOutput('milestone_number', String(milestone.number));

            const fs = require('fs');
            fs.writeFileSync('/tmp/merged-prs.json', JSON.stringify(
              mergedPrs.map((p) => ({ number: p.number, title: p.title, url: p.html_url }))
            ));

      - name: Update CHANGELOG.md
        run: |
          python3 << 'PYEOF'
          import json
          import sys
          from datetime import date

          with open('/tmp/merged-prs.json') as f:
              prs = json.load(f)

          version = "${{ steps.version.outputs.version }}".lstrip('v')
          today = date.today().isoformat()

          with open('CHANGELOG.md') as f:
              content = f.read()

          # Defense in depth alongside the open-PR guard above: refuse to
          # duplicate an entry if this version somehow already has one
          # (e.g. a prior cut's PR merged CHANGELOG but never got tagged).
          if f"## [{version}]" in content:
              print(f"CHANGELOG.md already has an entry for {version} - refusing to duplicate it.", file=sys.stderr)
              sys.exit(1)

          entry_lines = [f"## [{version}] - {today}", ""]
          for pr in prs:
              entry_lines.append(f"- {pr['title']} (#{pr['number']})")
          entry_lines.append("")
          entry = "\n".join(entry_lines)

          marker = "## [Unreleased]"
          idx = content.index(marker) + len(marker)
          new_content = content[:idx] + "\n\n" + entry + content[idx:].lstrip("\n")

          with open('CHANGELOG.md', 'w') as f:
              f.write(new_content)
          PYEOF

      - name: Configure bot git identity and branch
        id: release-branch
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          slug="ai-vitals-bot"
          bot_id=$(gh api "/users/${slug}[bot]" --jq .id)
          git config user.name "${slug}[bot]"
          git config user.email "${bot_id}+${slug}[bot]@users.noreply.github.com"
          branch="release/${{ steps.version.outputs.version }}"
          git checkout -b "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Commit CHANGELOG and push to release branch
        run: |
          git add CHANGELOG.md
          git commit -m "Release ${{ steps.version.outputs.version }}"
          git push origin "${{ steps.release-branch.outputs.branch }}"

      - name: Open release PR
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const prs = JSON.parse(fs.readFileSync('/tmp/merged-prs.json', 'utf8'));
            const bullets = prs.map((p) => `- ${p.title} (#${p.number})`).join('\n');

            // Marker carries metadata "Finalize release" needs after merge
            // (release_notes can't be re-derived once the milestone bucket
            // is closed and reopened empty by this same finalize step).
            const marker = JSON.stringify({
              version: '${{ steps.version.outputs.version }}',
              bucket: '${{ inputs.bucket }}',
              milestoneNumber: Number('${{ steps.version.outputs.milestone_number }}'),
            });

            await github.rest.pulls.create({
              owner, repo,
              title: `Release ${{ steps.version.outputs.version }}`,
              head: '${{ steps.release-branch.outputs.branch }}',
              base: 'main',
              body: [
                `<!-- release-meta: ${marker} -->`,
                `Automated CHANGELOG.md update for release ${{ steps.version.outputs.version }}.`,
                '',
                'Merging this PR (a human must approve and merge, same as any',
                'other PR) triggers tagging, the GitHub Release, and milestone',
                'rollover automatically - see the "Finalize release" workflow.',
                '',
                '## Included PRs',
                bullets,
              ].join('\n'),
            });
