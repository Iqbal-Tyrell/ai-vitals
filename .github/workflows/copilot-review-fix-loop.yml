name: Copilot review fix-loop

# Polls (rather than reacts to an event) for native GitHub Copilot code
# review's outcome on PRs carrying the needs-review label. Confirmed
# live, twice, that neither pull_request_review nor check_run fire a
# triggerable Actions event for Copilot's automated reviews: it runs as
# an internal Actions workflow in this repo, so everything it posts
# inherits GitHub's own GITHUB_TOKEN recursion-prevention rule ("events
# triggered using the repository's GITHUB_TOKEN will not create a new
# workflow run") - not fixable by choosing a different event type.
#
# Copilot review's check-run conclusion is always "success" regardless
# of findings (it only reflects "the review ran", not "the code is
# clean"), so the real signal is whether it left any UNRESOLVED
# review-comment threads (verified via GraphQL reviewThreads.isResolved).
# Capped at 5 rounds via a round marker comment; escalates to
# needs-human-attention rather than looping forever.

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  list-prs:
    runs-on: ubuntu-latest
    outputs:
      prs: ${{ steps.list.outputs.prs }}
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: List open PRs awaiting review, not already escalated
        id: list
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const prs = await github.paginate(github.rest.pulls.list, {
              owner, repo, state: 'open', per_page: 100,
            });
            const eligible = prs
              .filter((p) => {
                const labels = p.labels.map((l) => l.name);
                return labels.includes('needs-review') && !labels.includes('needs-human-attention');
              })
              .map((p) => p.number);
            core.setOutput('prs', JSON.stringify(eligible));
            core.info(`Eligible PRs: ${JSON.stringify(eligible)}`);

  fix-loop:
    needs: list-prs
    if: needs.list-prs.outputs.prs != '[]'
    strategy:
      fail-fast: false
      matrix:
        pull_number: ${{ fromJSON(needs.list-prs.outputs.prs) }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Check unresolved Copilot review threads + round count
        id: check
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const pull_number = ${{ matrix.pull_number }};

            const pr = await github.rest.pulls.get({ owner, repo, pull_number });

            const query = `
              query($owner: String!, $repo: String!, $pr: Int!) {
                repository(owner: $owner, name: $repo) {
                  pullRequest(number: $pr) {
                    reviewThreads(first: 100) {
                      nodes {
                        id
                        isResolved
                        comments(first: 1) {
                          nodes { databaseId author { login } path line body }
                        }
                      }
                    }
                  }
                }
              }`;
            const result = await github.graphql(query, { owner, repo, pr: pull_number });
            const threads = result.repository.pullRequest.reviewThreads.nodes;
            const unresolved = threads.filter((t) => {
              const first = t.comments.nodes[0];
              return !t.isResolved && first && first.author && first.author.login.includes('copilot-pull-request-reviewer');
            });

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner, repo, issue_number: pull_number, per_page: 100,
            });
            let round = 0;
            for (const c of comments) {
              const m = c.body.match(/<!-- l4:fix-round:(\d+) -->/);
              if (m) round = Math.max(round, parseInt(m[1], 10));
            }

            core.setOutput('unresolved_count', String(unresolved.length));
            core.setOutput('round', String(round));
            core.setOutput('head_ref', pr.data.head.ref);

            const fs = require('fs');
            // Manifest maps each finding's index back to its GraphQL thread id
            // (for resolveReviewThread) and REST comment databaseId (for
            // posting a threaded reply) - copilot only sees the findings file.
            const manifest = unresolved.map((t, i) => ({
              index: i + 1,
              threadId: t.id,
              commentDatabaseId: t.comments.nodes[0].databaseId,
            }));
            fs.writeFileSync('/tmp/findings-manifest.json', JSON.stringify(manifest));
            fs.writeFileSync('/tmp/unresolved-findings.md', unresolved.map((t, i) => {
              const c = t.comments.nodes[0];
              return `### Finding ${i + 1}\n**Location**: \`${c.path}:${c.line}\`\n\n${c.body}`;
            }).join('\n\n'));

      - name: Mark ready-for-merge (no unresolved findings)
        if: steps.check.outputs.unresolved_count == '0'
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = ${{ matrix.pull_number }};
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['ready-for-merge'] });
            try {
              await github.rest.issues.removeLabel({ owner, repo, issue_number, name: 'needs-review' });
            } catch (e) {
              core.info(`needs-review label not present or already removed: ${e.message}`);
            }

      - name: Escalate (5-round cap reached)
        if: steps.check.outputs.unresolved_count != '0' && fromJSON(steps.check.outputs.round) >= 5
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const { owner, repo } = context.repo;
            const issue_number = ${{ matrix.pull_number }};
            await github.rest.issues.addLabels({ owner, repo, issue_number, labels: ['needs-human-attention'] });
            await github.rest.issues.createComment({
              owner, repo, issue_number,
              body: '_Fix-loop hit its 5-round cap with unresolved Copilot review findings still open. Escalating to a human - no further automated fix attempts will run on this PR._',
            });

      - name: Checkout PR branch (fix round)
        if: steps.check.outputs.unresolved_count != '0' && fromJSON(steps.check.outputs.round) < 5
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ steps.check.outputs.head_ref }}

      - name: Configure bot git identity
        if: steps.check.outputs.unresolved_count != '0' && fromJSON(steps.check.outputs.round) < 5
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: |
          slug="ai-vitals-bot"
          bot_id=$(gh api "/users/${slug}[bot]" --jq .id)
          git config user.name "${slug}[bot]"
          git config user.email "${bot_id}+${slug}[bot]@users.noreply.github.com"

      - name: Install Copilot CLI
        if: steps.check.outputs.unresolved_count != '0' && fromJSON(steps.check.outputs.round) < 5
        run: npm install -g @github/copilot

      - name: Fix unresolved findings
        if: steps.check.outputs.unresolved_count != '0' && fromJSON(steps.check.outputs.round) < 5
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
        run: |
          copilot -p "GitHub's native Copilot code review left unresolved findings on this PR, listed in /tmp/unresolved-findings.md (read that file - each has a numbered Finding heading with a Location: file:line and description). For EVERY numbered finding: first verify it is a real issue by reading the actual code at that location yourself - do not blindly apply a fix without checking. If it is a genuine issue, fix it. If you determine it is a false positive, leave the code as-is and explain why. Follow this repo's existing conventions (Laravel 13 + Filament, Pest, Larastan level 8, Pint). Run the project's own validation (pest, phpstan, pint) before finishing if applicable. Then write a JSON array to /tmp/fix-results.json - nothing else in that file - with exactly one object per finding, in this exact shape: [{\"index\": 1, \"addressed\": true, \"reply\": \"one to three sentences explaining what you did or why it's a false positive, suitable as a direct reply to the reviewer comment\"}, ...]. The index must match the finding's number exactly." \
            --allow-all-tools \
            --no-ask-user \
            -s

      - name: Commit and push fix
        if: steps.check.outputs.unresolved_count != '0' && fromJSON(steps.check.outputs.round) < 5
        id: commit
        run: |
          next_round=$(( ${{ steps.check.outputs.round }} + 1 ))
          if [ -z "$(git status --porcelain)" ]; then
            echo "has_changes=false" >> "$GITHUB_OUTPUT"
          else
            git add -A
            git commit -m "Fix: address Copilot review round ${next_round}"
            git push origin HEAD:${{ steps.check.outputs.head_ref }}
            echo "has_changes=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Reply to each review thread and resolve it
        if: steps.check.outputs.unresolved_count != '0' && fromJSON(steps.check.outputs.round) < 5
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const pull_number = ${{ matrix.pull_number }};
            const nextRound = Number('${{ steps.check.outputs.round }}') + 1;
            const hasChanges = '${{ steps.commit.outputs.has_changes }}' === 'true';

            const manifest = JSON.parse(fs.readFileSync('/tmp/findings-manifest.json', 'utf8'));
            let results = [];
            try {
              results = JSON.parse(fs.readFileSync('/tmp/fix-results.json', 'utf8'));
            } catch (e) {
              core.warning(`Could not parse fix-results.json: ${e.message}`);
            }

            for (const entry of manifest) {
              const result = results.find((r) => r.index === entry.index);
              const replyBody = result?.reply || 'Reviewed - see the fix-round summary comment below for details.';
              try {
                await github.rest.pulls.createReplyForReviewComment({
                  owner, repo, pull_number,
                  comment_id: entry.commentDatabaseId,
                  body: replyBody,
                });
              } catch (e) {
                core.warning(`Failed to reply to comment ${entry.commentDatabaseId}: ${e.message}`);
              }
              try {
                await github.graphql(
                  `mutation($threadId: ID!) { resolveReviewThread(input: { threadId: $threadId }) { thread { id } } }`,
                  { threadId: entry.threadId },
                );
              } catch (e) {
                core.warning(`Failed to resolve thread ${entry.threadId}: ${e.message}`);
              }
            }

            const body = hasChanges
              ? `<!-- l4:fix-round:${nextRound} -->\n**Fix round ${nextRound}/5** - replied to each finding above; pushed a fix commit. Copilot will re-review automatically; the next poll picks up its result.`
              : `<!-- l4:fix-round:${nextRound} -->\n**Fix round ${nextRound}/5** - replied to each finding above; no code changes were needed (all judged false-positive, or already addressed).`;
            await github.rest.issues.createComment({ owner, repo, issue_number: pull_number, body });
